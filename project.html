<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details — Simar Graphic Designer</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff5722%22/><text y=%22.75em%22 x=%2250%25%22 text-anchor=%22middle%22 font-size=%2265%22 font-family=%22serif%22 font-weight=%22900%22 fill=%22%23ffffff%22>S</text></svg>">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .project-header {
      padding-top: 150px;
      padding-bottom: 50px;
      border-bottom: var(--border-retro-thick);
    }
    .project-meta-top {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .project-cat-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background-color: var(--color-yellow);
      color: var(--retro-ink);
      padding: 4px 14px;
      border: var(--border-retro);
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--retro-ink);
    }
    .project-year-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--retro-ink-muted);
      border-left: 2px solid var(--retro-ink);
      padding-left: 12px;
    }
    .project-headline {
      font-family: var(--font-vintage);
      font-size: clamp(3.2rem, 8vw, 6.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      line-height: 0.95;
    }
    .project-lead {
      font-family: var(--font-mono);
      font-size: clamp(1.2rem, 2.2vw, 1.5rem);
      line-height: 1.6;
      color: var(--retro-ink);
      max-width: 820px;
      font-weight: 500;
      background-color: var(--retro-paper-light);
      padding: 24px 28px;
      border: var(--border-retro-thick);
      border-radius: 8px;
      box-shadow: var(--shadow-retro);
    }
    .project-hero-media {
      margin: 60px 0;
      width: 100%;
      border: var(--border-retro-thick);
      border-radius: 12px;
      box-shadow: var(--shadow-retro-lg);
      background-color: var(--retro-paper-dark);
      overflow: hidden;
      cursor: zoom-in;
    }
    .project-cover-full {
      width: 100%;
      height: auto;
      max-height: 800px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .project-cover-full:hover {
      transform: scale(1.015);
    }
    .project-details-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 60px;
      margin: 70px 0;
      align-items: start;
    }
    .project-specs {
      background-color: var(--card-tint-2);
      border: var(--border-retro-thick);
      border-radius: 10px;
      padding: 30px;
      box-shadow: var(--shadow-retro);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .spec-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-color);
      margin-bottom: 6px;
      display: block;
    }
    .spec-val {
      font-family: var(--font-vintage);
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--retro-ink);
    }
    .project-story {
      background-color: var(--retro-paper-light);
      border: var(--border-retro-thick);
      border-radius: 10px;
      padding: 40px;
      box-shadow: var(--shadow-retro);
    }
    .story-heading {
      font-family: var(--font-vintage);
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--retro-ink);
      border-bottom: 2px dashed var(--retro-ink);
      padding-bottom: 10px;
    }
    .project-gallery-section {
      margin: 80px 0;
      border-top: var(--border-retro-thick);
      padding-top: 60px;
    }
    .gallery-title {
      font-family: var(--font-vintage);
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }
    .gallery-item-wrap {
      cursor: zoom-in;
      background: var(--retro-paper-light);
      border: var(--border-retro-thick);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-retro);
      position: relative;
      transition: var(--transition-pop);
    }
    .gallery-item-wrap:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--shadow-retro-hover);
    }
    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 18px;
      background: rgba(25, 22, 20, 0.85);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .project-bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 0;
      border-top: var(--border-retro-thick);
      flex-wrap: wrap;
      gap: 20px;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(25, 22, 20, 0.95);
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: zoom-out;
    }
    .lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: var(--border-retro-thick);
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .lightbox-close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .project-details-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!-- Supabase Official JS SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo-wrap">
        <a href="index.html" class="site-logo">
          SIMAR <span class="logo-stamp">STUDIO</span>
        </a>
        <span class="role-badge">Graphic Designer</span>
      </div>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html#work" class="nav-link">← Return to Archive</a></li>
          <li><a href="index.html#contact" class="nav-link">Commission Work</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="admin.html" class="admin-link"><span>⚙</span> Admin</a>
      </div>
    </div>
  </header>

  <main class="container" id="project-detail-content">
    <div style="padding: 160px 0; text-align: center; color: var(--retro-ink-muted); font-family: var(--font-mono); font-weight: 700;">
      LOADING ARCHIVE CASE STUDY...
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img src="" alt="Enlarged view" class="lightbox-content" id="lightbox-image">
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        SIMAR <span style="color: var(--accent-color);">★</span> GRAPHIC DESIGNER
      </div>
      <div class="footer-copy">
        &copy; <span id="current-year"></span> SIMAR. ALL RIGHTS RESERVED.
      </div>
      <a href="index.html#hero" class="back-to-top">TOP ↑</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/project-detail.js"></script>
</body>
</html>
